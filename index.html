<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VitaCheck BMI Calculator</title>

    <link rel="stylesheet" href="./Style.css">
</head>

<body>

    <div class="calculator">

        <h1>VitaCheck</h1>

        <p class="subtitle">BMI Calculator</p>

        <label for="weight">Weight in kilograms</label>

        <input
            type="number"
            id="weight"
            placeholder="Example: 70"
            min="0"
            max="200"
            step="0.1"
        >

        <label for="height">Height in (m) </label>

        <input
            type="number"
            id="height"
            placeholder="Example: 1.75"
            min="0.5"
            max="3"
            step="0.01"
        >

        <button onclick="calculateBMI()">Calculate BMI</button>

        <div id="result"></div>

    </div>

<footer class="footer">
        <p>&copy; 2026 Gabriela Costa. All rights reserved.</p>
    </footer>
    
    <script src="script.js"></script>
    
</body>
</html>
